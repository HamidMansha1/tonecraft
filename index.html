<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToneCraft - Micro AI Support Copy Rewriter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">
  
  <div class="max-w-2xl w-full mt-10 bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-indigo-400 mb-2">⚡ ToneCraft Micro-SaaS</h1>
    <p class="text-slate-400 text-sm mb-6">Transform raw technical notes or blunt responses into polished customer communication.</p>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Your API Key (Stored locally in browser)</label>
        <input id="apiKey" type="password" placeholder="Enter your Gemini or OpenAI API Key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Draft Message / Technical Notes</label>
        <textarea id="draftText" rows="4" placeholder="Paste raw notes here... e.g., 'Build failed due to node version mismatch, fix package.json.'" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Target Tone</label>
        <select id="toneSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500">
          <option value="Empathetic & Helpful Technical Support">Empathetic & Helpful Support</option>
          <option value="Executive Professional & Formal">Executive Professional</option>
          <option value="Concise & Direct (Action-Oriented)">Concise & Direct</option>
        </select>
      </div>

      <button onclick="processText()" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition duration-200">
        Optimize Message
      </button>
    </div>

    <!-- Output Section -->
    <div id="outputContainer" class="mt-8 hidden border-t border-slate-700 pt-6">
      <h2 class="text-sm font-semibold text-slate-300 uppercase mb-2">Optimized Response</h2>
      <div id="outputText" class="bg-slate-900 border border-slate-700 p-4 rounded-lg text-sm text-slate-200 whitespace-pre-wrap"></div>
      <button onclick="navigator.clipboard.writeText(document.getElementById('outputText').innerText)" class="mt-3 text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-200">
        Copy Output
      </button>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
  });

  async function processText() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const draftText = document.getElementById('draftText').value.trim();
    const tone = document.getElementById('toneSelect').value;
    const btn = document.getElementById('btnSubmit');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');

    if (!apiKey || !draftText) {
      alert('Please provide both API Key and text draft.');
      return;
    }

    localStorage.setItem('gemini_api_key', apiKey);

    btn.innerText = 'Processing...';
    btn.disabled = true;

    const prompt = `Rewrite the following message into a ${tone} tone for customer communication. Keep it clear, well-structured, and accurate:\n\n"${draftText}"`;

    try {
      // Updated to gemini-3.8-flash endpoint
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();

      if (data.error) {
        outputText.innerText = `API Error: ${data.error.message}`;
      } else {
        const result = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
        outputText.innerText = result;
      }

      outputContainer.classList.remove('hidden');
    } catch (err) {
      outputText.innerText = `Request Failed: ${err.message}`;
      outputContainer.classList.remove('hidden');
    } finally {
      btn.innerText = 'Optimize Message';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
